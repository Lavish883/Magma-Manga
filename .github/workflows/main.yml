name: Trigger auto deployment for magma-manga

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '.github/workflows/magma-manga-test-AutoDeployTrigger-a05bcb1d-9644-49ee-9ee4-f835dc16c874.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Azure OIDC authentication
      contents: read
      packages: write # REQUIRED: Gives permission to upload to GitHub's free registry

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MAGMAMANGATEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MAGMAMANGATEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MAGMAMANGATEST_AZURE_SUBSCRIPTION_ID }}

      # Docker requires image names to be entirely lowercase. 
      # This step ensures your GitHub username and repo name don't break the build if they have capital letters.
      - name: Convert repository name to lowercase
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          
          # 1. Switched to GitHub's Free Container Registry
          registryUrl: ghcr.io
          
          # 2. Using built-in GitHub Action variables (No need to create secrets for these!)
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          
          containerAppName: magma-manga-test
          resourceGroup: DefaultResourceGroup-EUS
          
          # 3. Pushing the image to your repository's package space
          imageToBuild: ghcr.io/${{ env.REPO }}/magma-manga-test:${{ github.sha }}
